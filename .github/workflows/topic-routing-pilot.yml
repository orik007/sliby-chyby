name: Topic-routing pilot (unpublished report)

on:
  workflow_dispatch:
    inputs:
      since:
        description: Optional YYYY-MM-DD override for collection; leave empty for per-source checkpoints
        required: false
        default: ""
        type: string
      as_of:
        description: Pilot cutoff date; leave empty to use the UTC run date
        required: false
        default: ""
        type: string
      sample_promises:
        description: Limit tagging to the first N published promises (deterministic); leave empty for the full catalogue
        required: false
        default: ""
        type: string
      sample_records:
        description: Limit tagging to the first N material primary records (deterministic); leave empty for all of them
        required: false
        default: ""
        type: string
      tagging_concurrency:
        description: Parallel tagged subjects in flight (each uses 2 API calls); leave empty for the safe Tier-1 default of 1. Raise this once the account's usage tier allows more TPM headroom.
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: topic-routing-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Run the topic-routing pilot and upload its report
    runs-on: ubuntu-latest
    # A full historical backfill (--since covering the whole campaign period)
    # tags far more records than the incremental default this limit was
    # originally sized for; a hard timeout mid-run would forcibly kill the
    # process before its own cache-persisting `finally` block can run,
    # losing already-paid-for tagging work. 300 minutes gives real headroom;
    # it can be lowered again once typical backfill run time is known.
    timeout-minutes: 300
    environment:
      name: assessment
      deployment: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COLLECTOR_SINCE: ${{ inputs.since || '' }}
      PILOT_AS_OF: ${{ inputs.as_of || '' }}
      PILOT_SAMPLE_PROMISES: ${{ inputs.sample_promises || '' }}
      PILOT_SAMPLE_RECORDS: ${{ inputs.sample_records || '' }}
      SLIBY_TAGGING_PROVIDER: openai
      SLIBY_TAGGING_MODEL_A: gpt-5.6-terra
      SLIBY_TAGGING_MODEL_B: gpt-5.6-terra
      # A full backfill run at the script's own default of 4 (8 parallel API
      # calls) reliably exhausted the account's Tier-1 500,000 TPM budget for
      # gpt-5.6-terra within about a minute -- confirmed by a real run whose
      # retries (added for exactly this) still ran out after 6 attempts,
      # because the account was structurally over its sustained throughput,
      # not just hit by an isolated burst. 1 keeps sustained demand well
      # under that budget; raise it via the tagging_concurrency input once
      # the account's usage tier allows more TPM headroom.
      SLIBY_TAGGING_CONCURRENCY: ${{ inputs.tagging_concurrency || '1' }}
    steps:
      - name: Check out repository
        # Pinned back to `main`. An earlier revision of this workflow
        # deliberately dropped this pin (see PR #58) precisely because the
        # job was contents:read and "never wrote anything back" -- an
        # unmerged branch's code could at worst leak OPENAI_API_KEY, not
        # corrupt durable state. That justification no longer holds now that
        # this job has contents:write and pushes tag-assignment state to the
        # durable automation/assessment-review branch: unreviewed code could
        # otherwise push arbitrary or corrupted data there. Pin to main so
        # only reviewed, merged code can ever write to that branch.
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Restore current audit state
        # Mirrors collect-evidence.yml's own restore step: the durable
        # source of truth for anything this pipeline must not re-pay for is
        # the automation/assessment-review branch, committed with
        # --force-with-lease at the end of this job -- not a GitHub Actions
        # cache. A cache is convenient but time-boxed (evicted after 7 days
        # unused, or once the repository's total cache size is exceeded) and,
        # critically, is skipped on a failed job by actions/cache's own
        # default; a git commit on a durable branch has neither problem.
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$authenticated_remote" automation/assessment-review >/dev/null 2>&1; then
            git fetch "$authenticated_remote" "+refs/heads/automation/assessment-review:refs/remotes/origin/automation/assessment-review"
            audit_branch_tip="$(git rev-parse origin/automation/assessment-review)"
            restore_paths=()
            if git cat-file -e origin/automation/assessment-review:automation/collectors/checkpoints.json 2>/dev/null; then
              restore_paths+=(automation/collectors/checkpoints.json)
            fi
            while IFS= read -r path; do
              restore_paths+=("$path")
            done < <(git ls-tree -r --name-only origin/automation/assessment-review -- automation/topic-routing/pilot-cache)
            if [ "${#restore_paths[@]}" -gt 0 ]; then
              git restore --source=origin/automation/assessment-review --staged --worktree -- "${restore_paths[@]}"
              echo "Restored per-source checkpoints (read-only here) and the tag-assignment cache from automation/assessment-review."
            fi
          else
            audit_branch_tip=""
            echo "No automation/assessment-review branch found yet; this run bootstraps both from scratch."
          fi
          echo "AUDIT_BRANCH_TIP=$audit_branch_tip" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Collect source records
        run: |
          collector_args=(
            --checkpoints automation/collectors/checkpoints.json
            --output automation/runs/pipeline/topic-routing-pilot-collector
          )
          if [ -n "$COLLECTOR_SINCE" ]; then
            collector_args+=(--since "$COLLECTOR_SINCE")
          fi
          node scripts/run-collectors.mjs "${collector_args[@]}"

      - name: Run the topic-routing pilot
        run: |
          AS_OF="${PILOT_AS_OF:-$(date -u +%F)}"
          pilot_args=(
            --collector-run automation/runs/pipeline/topic-routing-pilot-collector/collector-run.json
            --as-of "$AS_OF"
            --output automation/runs/pipeline/topic-routing-pilot
          )
          if [ -n "$PILOT_SAMPLE_PROMISES" ]; then
            pilot_args+=(--sample-promises "$PILOT_SAMPLE_PROMISES")
          fi
          if [ -n "$PILOT_SAMPLE_RECORDS" ]; then
            pilot_args+=(--sample-records "$PILOT_SAMPLE_RECORDS")
          fi
          node scripts/run-topic-routing-pilot.mjs "${pilot_args[@]}"

      - name: Persist tag-assignment cache to the audit branch
        # `if: always()` is the entire point of this step: the pilot script's
        # own try/finally (scripts/run-topic-routing-pilot.mjs) already
        # writes every tag it has successfully paid for to
        # automation/topic-routing/pilot-cache on disk even when the run
        # fails partway through (a rate limit, a validation error on one
        # subject, ...) -- but that only survives on the ephemeral runner's
        # disk unless this step also runs and commits it. Without
        # `always()`, a failed "Run the topic-routing pilot" step would skip
        # straight to upload-artifact, and the next run would re-request and
        # re-pay for every tag this one already got.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          if [ -d automation/topic-routing/pilot-cache ]; then
            git add automation/topic-routing/pilot-cache
          fi
          if git diff --cached --quiet; then
            echo "No new tag-assignment cache entries to persist."
          else
            git commit -m "Record topic-routing tag-assignment cache"
            git push --force-with-lease="refs/heads/automation/assessment-review:$AUDIT_BRANCH_TIP" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/automation/assessment-review"
            echo "AUDIT_BRANCH_TIP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "Persisted the tag-assignment cache to automation/assessment-review."
          fi

      - name: Upload the unpublished pilot report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: topic-routing-pilot-report
          path: automation/runs/pipeline/topic-routing-pilot
          retention-days: 30

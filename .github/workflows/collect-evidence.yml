name: Collect and match evidence

on:
  schedule:
    - cron: "37 9 * * *"
      timezone: "Europe/Prague"
  workflow_dispatch:
    inputs:
      since:
        description: Earliest publication or event date (YYYY-MM-DD)
        required: true
        default: "2025-10-01"
        type: string
      as_of:
        description: Matching cutoff date; leave empty to use the UTC run date
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-evidence-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and match confirmed promises
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COLLECTOR_SINCE: ${{ inputs.since || '2025-10-01' }}
      MATCHER_AS_OF: ${{ inputs.as_of || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect source records
        run: node scripts/run-collectors.mjs --since "$COLLECTOR_SINCE" --output automation/runs/pipeline/github-actions/collector
      - name: Match records to every confirmed promise
        run: |
          AS_OF="${MATCHER_AS_OF:-$(date -u +%F)}"
          node scripts/run-matcher.mjs --collector-run automation/runs/pipeline/github-actions/collector/collector-run.json --as-of "$AS_OF" --output automation/runs/pipeline/github-actions/matcher
      - name: Enrich matched parliamentary documents
        run: node scripts/run-print-enrichment.mjs --input automation/runs/pipeline/github-actions/matcher/evidence-packages --output automation/runs/pipeline/github-actions/matcher/enriched-evidence-packages
      - name: Audit coverage
        run: node scripts/run-coverage-audit.mjs --collector-run automation/runs/pipeline/github-actions/collector/collector-run.json --matcher-run automation/runs/pipeline/github-actions/matcher/match-run.json --output automation/runs/pipeline/github-actions/coverage-audit.json --markdown automation/runs/pipeline/github-actions/coverage-audit.md
      - name: Upload pipeline audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidence-pipeline-${{ github.run_id }}
          path: automation/runs/pipeline/github-actions/
          if-no-files-found: error
          retention-days: 30

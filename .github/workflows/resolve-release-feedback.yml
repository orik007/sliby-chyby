name: Resolve release feedback

on:
  repository_dispatch:
    types:
      - sliby-release-resolver

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-resolver-${{ github.event.client_payload.pull_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve one pull-request feedback package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact pull-request revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.client_payload.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve bounded feedback
        run: node scripts/run-release-resolver.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLIBY_RESOLVER_MODEL: gpt-5.6-terra

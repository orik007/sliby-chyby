name: Collect, match, and assess confirmed promises

on:
  # Scheduled daily run paused 2026-09-19 while the promise-evidence
  # matching mechanism is reworked (the exact-signal/semantic matcher is
  # being replaced by the tag-based routing design in
  # docs/topic-routing-design.md). Re-enable this schedule block only once
  # that replacement is in place; until then, run manually via
  # workflow_dispatch when deliberately testing.
  # schedule:
  #   - cron: "37 9 * * *"
  #     timezone: "Europe/Prague"
  workflow_dispatch:
    inputs:
      since:
        description: Optional YYYY-MM-DD override for a manual backfill; leave empty for per-source checkpoints
        required: false
        default: ""
        type: string
      as_of:
        description: Assessment cutoff date; leave empty to use the UTC run date
        required: false
        default: ""
        type: string
      sources:
        description: Optional comma-separated collector source IDs for a targeted replay
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evidence-assessment-review
  cancel-in-progress: false

jobs:
  collect:
    name: Build unpublished review proposals
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: assessment
      deployment: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COLLECTOR_SINCE: ${{ inputs.since || '' }}
      COLLECTOR_SOURCES: ${{ inputs.sources || '' }}
      MATCHER_AS_OF: ${{ inputs.as_of || '' }}
      REVIEW_BRANCH: automation/assessment-review
      SLIBY_ASSESSOR_PROVIDER_A: openai
      SLIBY_ASSESSOR_PROVIDER_B: openai
      SLIBY_ARBITER_PROVIDER: openai
      SLIBY_ASSESSOR_MODEL_A: gpt-5.6-terra
      SLIBY_ASSESSOR_MODEL_B: gpt-5.6-terra
      SLIBY_ARBITER_MODEL: gpt-5.6-sol
      SLIBY_SEMANTIC_PROVIDER: openai
      SLIBY_SEMANTIC_MODEL: text-embedding-3-small
      SLIBY_SEMANTIC_DIMENSIONS: 256
      SLIBY_SEMANTIC_CANDIDATE_LIMIT: 3
      SLIBY_SEMANTIC_MIN_SIMILARITY: 0.55
      SLIBY_ASSESSMENT_CONCURRENCY: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Restore current audit state
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$authenticated_remote" "$REVIEW_BRANCH" >/dev/null 2>&1; then
            git fetch "$authenticated_remote" "+refs/heads/$REVIEW_BRANCH:refs/remotes/origin/$REVIEW_BRANCH"
            audit_branch_tip="$(git rev-parse "origin/$REVIEW_BRANCH")"
            restore_paths=()
            for path in automation/collectors/checkpoints.json automation/semantic-index/promise-index.json; do
              if git cat-file -e "origin/$REVIEW_BRANCH:$path" 2>/dev/null; then
                restore_paths+=("$path")
              fi
            done
            for directory in automation/evidence-packages automation/review-proposals; do
              while IFS= read -r path; do
                case "$path" in
                  */README.md) ;;
                  *) restore_paths+=("$path") ;;
                esac
              done < <(git ls-tree -r --name-only "origin/$REVIEW_BRANCH" -- "$directory")
            done
            if [ "${#restore_paths[@]}" -gt 0 ]; then
              git restore --source="origin/$REVIEW_BRANCH" --staged --worktree -- "${restore_paths[@]}"
            fi
          else
            audit_branch_tip=""
          fi
          echo "AUDIT_BRANCH_TIP=$audit_branch_tip" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Collect source records
        run: |
          collector_args=(
            --checkpoints automation/collectors/checkpoints.json
            --write-checkpoints automation/collectors/checkpoints.json
            --output automation/runs/pipeline/github-actions/collector
          )
          if [ -n "$COLLECTOR_SINCE" ]; then
            collector_args+=(--since "$COLLECTOR_SINCE")
          fi
          if [ -n "$COLLECTOR_SOURCES" ]; then
            IFS=',' read -ra source_ids <<< "$COLLECTOR_SOURCES"
            for source_id in "${source_ids[@]}"; do
              source_id="${source_id#"${source_id%%[![:space:]]*}"}"
              source_id="${source_id%"${source_id##*[![:space:]]}"}"
              if [ -z "$source_id" ]; then
                echo "::error::COLLECTOR_SOURCES must contain comma-separated source IDs."
                exit 1
              fi
              collector_args+=(--source "$source_id")
            done
          fi
          node scripts/run-collectors.mjs "${collector_args[@]}"

      - name: Match records to every confirmed promise
        run: |
          AS_OF="${MATCHER_AS_OF:-$(date -u +%F)}"
          node scripts/run-matcher.mjs \
            --collector-run automation/runs/pipeline/github-actions/collector/collector-run.json \
            --semantic-index automation/semantic-index/promise-index.json \
            --write-semantic-index automation/semantic-index/promise-index.json \
            --as-of "$AS_OF" \
            --output automation/runs/pipeline/github-actions/matcher

      - name: Enrich matched parliamentary prints with official documents
        run: |
          node scripts/run-print-enrichment.mjs \
            --input automation/runs/pipeline/github-actions/matcher/evidence-packages \
            --retry-blocked-queue automation/evidence-packages \
            --output automation/runs/pipeline/github-actions/matcher/enriched-evidence-packages

      - name: Queue enriched evidence packages
        run: |
          node scripts/queue-evidence-packages.mjs \
            --input automation/runs/pipeline/github-actions/matcher/enriched-evidence-packages \
            --queue automation/evidence-packages \
            --enrichment-run automation/runs/pipeline/github-actions/matcher/enriched-evidence-packages/enrichment-run.json

      - name: Retire packages outside the active semantic policy
        run: node scripts/reconcile-evidence-package-queue.mjs --queue automation/evidence-packages

      - name: Persist source collection and queued evidence packages
        id: packages
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          git add automation/collectors/checkpoints.json automation/evidence-packages automation/semantic-index
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Record source collection and queue evidence packages"
            git push --force-with-lease="refs/heads/$REVIEW_BRANCH:$AUDIT_BRANCH_TIP" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$REVIEW_BRANCH"
            echo "AUDIT_BRANCH_TIP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create audit pull request for saved collection and packages when needed
        if: steps.packages.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          cat > "$RUNNER_TEMP/evidence-package-audit-pr.md" <<'EOF'
          ## Neveřejný audit sběru a balíčků podkladů

          Tento pull request uchovává úspěšný technický sběr i ověřené, omezené balíčky podkladů po enrichmentu. Balíčky čekají na dva nezávislé posudky; samy nemění veřejná data, skóre ani stav zveřejnění.

          Pokud hodnocení selže nebo je přerušeno, uložené balíčky zůstanou v této auditní větvi pro další běh.
          EOF
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REVIEW_BRANCH" --title "Audit sběru dat a neveřejných návrhů SLAVA" --body-file "$RUNNER_TEMP/evidence-package-audit-pr.md"
          fi

      - name: Assess only new or changed packages
        run: |
          node scripts/run-assessment-batch.mjs \
            --packages automation/evidence-packages \
            --enrichment-run automation/runs/pipeline/github-actions/matcher/enriched-evidence-packages/enrichment-run.json \
            --proposals automation/review-proposals \
            --runs automation/runs/pipeline/github-actions/assessments \
            --summary automation/runs/pipeline/github-actions/assessment-batch.json \
            --pull-request-body automation/runs/pipeline/github-actions/assessment-review-pr.md

      - name: Refresh human review pages
        run: npm run reviews:refresh

      - name: Audit coverage of every published promise
        run: |
          node scripts/run-coverage-audit.mjs \
            --collector-run automation/runs/pipeline/github-actions/collector/collector-run.json \
            --matcher-run automation/runs/pipeline/github-actions/matcher/match-run.json \
            --output automation/runs/pipeline/github-actions/coverage-audit.json \
            --markdown automation/runs/pipeline/github-actions/coverage-audit.md

      - name: Write audit summary
        run: |
          node --input-type=module -e '
            import { readFile, appendFile } from "node:fs/promises";
            const run = JSON.parse(await readFile("automation/runs/pipeline/github-actions/matcher/match-run.json", "utf8"));
            const collectorRun = JSON.parse(await readFile("automation/runs/pipeline/github-actions/collector/collector-run.json", "utf8"));
            const semantic = run.semanticRetrieval;
            const enrichment = JSON.parse(await readFile("automation/runs/pipeline/github-actions/matcher/enriched-evidence-packages/enrichment-run.json", "utf8"));
            const assessment = JSON.parse(await readFile("automation/runs/pipeline/github-actions/assessment-batch.json", "utf8"));
            const coverage = JSON.parse(await readFile("automation/runs/pipeline/github-actions/coverage-audit.json", "utf8"));
            const checkpoints = JSON.parse(await readFile("automation/collectors/checkpoints.json", "utf8"));
            const packageCount = run.promiseResults.filter((result) => result.evidencePackage).length;
            const candidateCount = run.promiseResults.reduce((sum, result) => sum + result.candidateMatchCount, 0);
            const documentCount = enrichment.results.reduce((sum, result) => sum + result.documentEvidenceCount, 0);
            const lines = [
              "## Unpublished evidence pipeline",
              "",
              `- Published promises checked: ${run.promiseResults.length}`,
              `- Potential matches: ${candidateCount}`,
              `- Semantic record embeddings: ${semantic.recordEmbeddingsCreated}`,
              `- Semantic candidate relationships: ${semantic.candidateRelationships}`,
              `- Semantic minimum similarity: ${semantic.minimumSimilarity}`,
              `- Semantic index rebuilt: ${semantic.indexRebuilt}`,
              `- Assessable evidence packages: ${packageCount}`,
              `- Official print documents added: ${documentCount}`,
              `- Document-enrichment warnings: ${enrichment.warnings.length}`,
              `- New assessment proposals: ${assessment.newProposalCount}`,
              `- Unchanged assessments skipped: ${assessment.unchangedCount}`,
              `- Assessments blocked by document warnings: ${assessment.blockedCount}`,
              `- Assessment cutoff: ${run.asOf}`,
              `- No candidate match (not a score): ${coverage.stateCounts["no-candidate-match"]}`,
              `- Matches without attributable primary evidence: ${coverage.stateCounts["candidate-matches-without-attributable-primary"]}`,
              `- Human-review proposals or unresolved reviews: ${coverage.stateCounts["review-candidate"] + coverage.stateCounts["human-review-required"]}`,
              "- Direction assigned: no",
              "- Publication approved: no",
              "- A missing match never becomes zero points.",
              ""
            ];
            await appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
            const sourceRows = collectorRun.collectors.map((collector) => {
              const checkpoint = checkpoints.sourceCheckpoints[collector.sourceId];
              return `| \`${collector.sourceId}\` | ${collector.collection.mode} | ${collector.collection.since} | ${collector.recordCount} | ${checkpoint?.lastObservedRecordAt?.slice(0, 10) ?? "—"} |`;
            });
            const failures = collectorRun.failures ?? [];
            // A thrown error message is arbitrary text: normalize it to a
            // single line so it cannot break the Markdown list it renders
            // into (a newline would end the bullet early; a missing message
            // would render the literal string "undefined").
            const renderFailureMessage = (message) => String(message ?? "(no message)").replace(/\s+/g, " ").trim() || "(no message)";
            const failureLines = failures.length > 0
              ? [
                  "",
                  `**${failures.length} zdroj(e) dnes selhaly a jejich checkpoint se nezměnil** — příští běh je zkusí znovu od stejného data, ostatní zdroje pokračovaly beze změny:`,
                  "",
                  ...failures.map(({ sourceId, message }) => `- \`${sourceId}\`: ${renderFailureMessage(message)}`)
                ]
              : [];
            const reviewLines = [
              "",
              "## Sběr dat a checkpointy zdrojů",
              "",
              "Tento pull request je auditní fronta. Uložení checkpointu pouze potvrzuje úspěšné technické získání zdroje; samo nemění veřejné hodnocení.",
              `Sémantické vyhledání použilo ${semantic.model} a pro každý primární záznam předalo ke kontrole jen kandidáty s podobností alespoň ${semantic.minimumSimilarity}, nejvýše ${semantic.candidateLimit}; podobnost sama o sobě nepotvrzuje souvislost ani hodnocení.`,
              "",
              "| Zdroj | Režim | Od | Záznamů | Nejnovější záznam |",
              "| --- | --- | --- | ---: | --- |",
              ...sourceRows,
              ...failureLines,
              ""
            ];
            await appendFile("automation/runs/pipeline/github-actions/assessment-review-pr.md", reviewLines.join("\n"));
          '

      - name: Commit new review proposals
        id: proposals
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          git add automation/review-proposals
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new audit data or assessment proposal was created." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Update evidence collection audit"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          git push --force-with-lease="refs/heads/$REVIEW_BRANCH:$AUDIT_BRANCH_TIP" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "AUDIT_BRANCH_TIP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or update human-review pull request
        if: steps.proposals.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "Audit sběru dat a neveřejných návrhů SLAVA" --body-file automation/runs/pipeline/github-actions/assessment-review-pr.md
            PR_URL="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          else
            if PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REVIEW_BRANCH" --title "Audit sběru dat a neveřejných návrhů SLAVA" --body-file automation/runs/pipeline/github-actions/assessment-review-pr.md 2>/tmp/slava-pr-error)"; then
              :
            else
              echo "::error::The audit branch was updated but GitHub Actions could not create the required review pull request."
              cat /tmp/slava-pr-error
              exit 1
            fi
          fi
          echo "Review pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete unpublished pipeline audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidence-pipeline-${{ github.run_id }}
          path: automation/runs/pipeline/github-actions/
          if-no-files-found: warn
          retention-days: 30

name: Run SLAVA assessment

on:
  workflow_dispatch:
    inputs:
      evidence_package:
        description: Checked-in bounded evidence package JSON under automation/evidence-packages
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: slava-assessment
  cancel-in-progress: false

jobs:
  assess:
    name: Validate and assess
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: assessment
      deployment: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVIDENCE_PACKAGE_INPUT: ${{ inputs.evidence_package }}
      SLIBY_ASSESSOR_PROVIDER_A: openai
      SLIBY_ASSESSOR_PROVIDER_B: openai
      SLIBY_ARBITER_PROVIDER: openai
      SLIBY_ASSESSOR_MODEL_A: gpt-5.6-terra
      SLIBY_ASSESSOR_MODEL_B: gpt-5.6-terra
      SLIBY_ARBITER_MODEL: gpt-5.6-sol
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Run independent assessments
        run: npm run assess:ci

      - name: Upload unpublished audit record
        uses: actions/upload-artifact@v6
        with:
          name: slava-assessment-${{ github.run_id }}
          path: automation/runs/github-actions/
          if-no-files-found: error
          retention-days: 30

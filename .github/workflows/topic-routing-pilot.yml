name: Topic-routing pilot (unpublished report)

on:
  workflow_dispatch:
    inputs:
      since:
        description: Optional YYYY-MM-DD override for collection; leave empty for per-source checkpoints
        required: false
        default: ""
        type: string
      as_of:
        description: Pilot cutoff date; leave empty to use the UTC run date
        required: false
        default: ""
        type: string
      sample_promises:
        description: Limit tagging to the first N published promises (deterministic); leave empty for the full catalogue
        required: false
        default: ""
        type: string
      sample_records:
        description: Limit tagging to the first N material primary records (deterministic); leave empty for all of them
        required: false
        default: ""
        type: string
      tagging_concurrency:
        description: Parallel tagged subjects in flight (each uses 2 API calls); leave empty for the safe Tier-1 default of 1. Raise this once the account's usage tier allows more TPM headroom.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: topic-routing-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Run the topic-routing pilot and upload its report
    runs-on: ubuntu-latest
    # A full historical backfill (--since covering the whole campaign period)
    # tags far more records than the incremental default this limit was
    # originally sized for; a hard timeout mid-run would forcibly kill the
    # process before its own cache-persisting `finally` block can run,
    # losing already-paid-for tagging work. 300 minutes gives real headroom;
    # it can be lowered again once typical backfill run time is known.
    timeout-minutes: 300
    environment:
      name: assessment
      deployment: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COLLECTOR_SINCE: ${{ inputs.since || '' }}
      PILOT_AS_OF: ${{ inputs.as_of || '' }}
      PILOT_SAMPLE_PROMISES: ${{ inputs.sample_promises || '' }}
      PILOT_SAMPLE_RECORDS: ${{ inputs.sample_records || '' }}
      SLIBY_TAGGING_PROVIDER: openai
      SLIBY_TAGGING_MODEL_A: gpt-5.6-terra
      SLIBY_TAGGING_MODEL_B: gpt-5.6-terra
      # A full backfill run at the script's own default of 4 (8 parallel API
      # calls) reliably exhausted the account's Tier-1 500,000 TPM budget for
      # gpt-5.6-terra within about a minute -- confirmed by a real run whose
      # retries (added for exactly this) still ran out after 6 attempts,
      # because the account was structurally over its sustained throughput,
      # not just hit by an isolated burst. 1 keeps sustained demand well
      # under that budget; raise it via the tagging_concurrency input once
      # the account's usage tier allows more TPM headroom.
      SLIBY_TAGGING_CONCURRENCY: ${{ inputs.tagging_concurrency || '1' }}
    steps:
      - name: Check out repository
        # No explicit `ref`: this defaults to whatever ref the manual dispatch
        # was run against (main, or an unmerged branch/PR), so a pilot change
        # can be tried before merge. This is a deliberate, accepted tradeoff,
        # not a claim of zero risk: the checked-out code runs with the live
        # OPENAI_API_KEY (below) in its environment, so it could in principle
        # use or exfiltrate that key. workflow_dispatch can only be triggered
        # by someone with write access to this repository, though -- unlike
        # pull_request_target on an external contributor's PR -- so this
        # never exposes the key to untrusted third-party code, only to a
        # branch the triggering maintainer already controls.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore per-source collector checkpoints (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$authenticated_remote" automation/assessment-review >/dev/null 2>&1; then
            git fetch "$authenticated_remote" "+refs/heads/automation/assessment-review:refs/remotes/origin/automation/assessment-review"
            if git cat-file -e origin/automation/assessment-review:automation/collectors/checkpoints.json 2>/dev/null; then
              git show origin/automation/assessment-review:automation/collectors/checkpoints.json > automation/collectors/checkpoints.json
              echo "Restored per-source checkpoints from automation/assessment-review. This workflow has contents:read only and never writes them back."
            fi
          else
            echo "No automation/assessment-review branch found yet; the collector will bootstrap from scratch this run."
          fi

      - name: Restore tag-assignment audit cache
        # GitHub Actions caches are immutable: a restore that hits the exact
        # `key` skips saving at the end of the job entirely, so a stable key
        # here would freeze the cache at whatever it held after the first
        # successful run and never pick up tags for newly collected records.
        # `key` is therefore always unique per run; `restore-keys` still
        # finds the most recent cache for the same taxonomy/prompt fingerprint.
        #
        # `save-always: true` overrides actions/cache's own default of
        # skipping the save when the job fails. The pilot script's own
        # try/finally already writes every tagger call already paid for to
        # this same local path even on a mid-run failure (a rate-limit
        # exhaustion, a transient outage, ...); without save-always that
        # local progress never reaches the cache actions/cache uploads, so
        # the next attempt would re-pay for already-tagged subjects instead
        # of picking up the cache this run actually produced.
        uses: actions/cache@v4
        with:
          path: automation/topic-routing/pilot-cache
          key: topic-routing-pilot-cache-${{ hashFiles('automation/topic-routing/taxonomy-v1.json', 'automation/prompts/tagger-v1.md') }}-${{ github.run_id }}
          restore-keys: |
            topic-routing-pilot-cache-${{ hashFiles('automation/topic-routing/taxonomy-v1.json', 'automation/prompts/tagger-v1.md') }}-
            topic-routing-pilot-cache-
          save-always: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Collect source records
        run: |
          collector_args=(
            --checkpoints automation/collectors/checkpoints.json
            --output automation/runs/pipeline/topic-routing-pilot-collector
          )
          if [ -n "$COLLECTOR_SINCE" ]; then
            collector_args+=(--since "$COLLECTOR_SINCE")
          fi
          node scripts/run-collectors.mjs "${collector_args[@]}"

      - name: Run the topic-routing pilot
        run: |
          AS_OF="${PILOT_AS_OF:-$(date -u +%F)}"
          pilot_args=(
            --collector-run automation/runs/pipeline/topic-routing-pilot-collector/collector-run.json
            --as-of "$AS_OF"
            --output automation/runs/pipeline/topic-routing-pilot
          )
          if [ -n "$PILOT_SAMPLE_PROMISES" ]; then
            pilot_args+=(--sample-promises "$PILOT_SAMPLE_PROMISES")
          fi
          if [ -n "$PILOT_SAMPLE_RECORDS" ]; then
            pilot_args+=(--sample-records "$PILOT_SAMPLE_RECORDS")
          fi
          node scripts/run-topic-routing-pilot.mjs "${pilot_args[@]}"

      - name: Upload the unpublished pilot report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: topic-routing-pilot-report
          path: automation/runs/pipeline/topic-routing-pilot
          retention-days: 30

name: Run end-to-end SLAVA pilot

on:
  workflow_dispatch:
    inputs:
      promise_id:
        description: Stable ID from automation/matching/promises.json
        required: true
        default: ano-2025-eet-2
        type: string
      since:
        description: Earliest official event date (YYYY-MM-DD)
        required: true
        default: "2025-10-01"
        type: string
      as_of:
        description: Assessment cutoff date (YYYY-MM-DD)
        required: true
        default: "2026-08-31"
        type: string

permissions:
  contents: read

concurrency:
  group: slava-e2e-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Collect, match, and assess
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: assessment
      deployment: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PILOT_PROMISE_ID: ${{ inputs.promise_id }}
      PILOT_SINCE: ${{ inputs.since }}
      PILOT_AS_OF: ${{ inputs.as_of }}
      SLIBY_ASSESSOR_PROVIDER_A: openai
      SLIBY_ASSESSOR_PROVIDER_B: openai
      SLIBY_ARBITER_PROVIDER: openai
      SLIBY_ASSESSOR_MODEL_A: gpt-5.6-terra
      SLIBY_ASSESSOR_MODEL_B: gpt-5.6-terra
      SLIBY_ARBITER_MODEL: gpt-5.6-sol
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Collect official parliamentary evidence
        run: node scripts/run-collectors.mjs --source psp-core-2025 --since "$PILOT_SINCE" --output automation/runs/e2e/collector

      - name: Match evidence to the selected promise
        run: node scripts/run-matcher.mjs --collector-run automation/runs/e2e/collector/collector-run.json --promise "$PILOT_PROMISE_ID" --as-of "$PILOT_AS_OF" --output automation/runs/e2e/matcher

      - name: Check whether an assessable package exists
        id: package
        run: |
          if [ -f "automation/runs/e2e/matcher/evidence-packages/${PILOT_PROMISE_ID}.json" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run two assessors and an arbiter when needed
        if: steps.package.outputs.available == 'true'
        run: node scripts/run-assessment.mjs "automation/runs/e2e/matcher/evidence-packages/${PILOT_PROMISE_ID}.json" automation/runs/e2e/assessment

      - name: Upload unpublished end-to-end audit
        uses: actions/upload-artifact@v6
        with:
          name: slava-e2e-${{ github.run_id }}
          path: automation/runs/e2e/
          if-no-files-found: error
          retention-days: 30

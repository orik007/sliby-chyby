name: Verify pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run build

      - name: Validate Cloudflare deployment package
        run: npx wrangler deploy --dry-run --config wrangler.deploy.jsonc --outdir /tmp/sliby-chyby-worker

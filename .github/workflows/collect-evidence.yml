name: Collect, match, and assess confirmed promises

on:
  # The daily run stays paused until a manual workflow_dispatch run of this
  # workflow has been verified end to end (docs/evidence-pipeline.md).
  # schedule:
  #   - cron: "37 9 * * *"
  #     timezone: "Europe/Prague"
  workflow_dispatch:
    inputs:
      as_of:
        description: Assessment cutoff date; leave empty to use the UTC run date
        required: false
        default: ""
        type: string
      max_assessments:
        description: Maximum evidence packages sent to the paid assessors in this run; 0 assesses none
        required: true
        default: "0"
        type: string
      tagging_concurrency:
        description: Parallel tagged subjects (each uses 2 API calls); leave empty for 8
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evidence-assessment-review
  cancel-in-progress: false

jobs:
  collect:
    name: Build unpublished review proposals
    runs-on: ubuntu-latest
    # The two paid steps have their own, shorter limits. A step that reaches
    # its limit fails like any other error, so the always() steps still save
    # the paid work already written to disk; the job limit is never reached.
    timeout-minutes: 300
    environment:
      name: assessment
      deployment: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AS_OF_INPUT: ${{ inputs.as_of || '' }}
      REVIEW_BRANCH: automation/assessment-review
      SLIBY_ASSESSOR_PROVIDER_A: openai
      SLIBY_ASSESSOR_PROVIDER_B: openai
      SLIBY_ARBITER_PROVIDER: openai
      SLIBY_ASSESSOR_MODEL_A: gpt-5.6-terra
      SLIBY_ASSESSOR_MODEL_B: gpt-5.6-terra
      SLIBY_ARBITER_MODEL: gpt-5.6-sol
      SLIBY_ASSESSMENT_CONCURRENCY: 4
      # A hard cap on packages sent to the paid assessors per run. A run
      # without the input (the schedule) assesses none until a cap is set.
      SLIBY_MAX_ASSESSMENTS: ${{ inputs.max_assessments || '0' }}
      # Every paid model call is appended here (tokens and estimated cost), so
      # the run's spend is known even when it fails.
      SLIBY_MODEL_CALL_LOG: automation/runs/pipeline/github-actions/model-calls.jsonl
      SLIBY_TAGGING_PROVIDER: openai
      SLIBY_TAGGING_MODEL_A: gpt-6-luna
      SLIBY_TAGGING_MODEL_B: gpt-6-luna
      # Parallel tagged subjects; override with the tagging_concurrency input
      # if the account's rate limits change.
      SLIBY_TAGGING_CONCURRENCY: ${{ inputs.tagging_concurrency || '8' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Restore current audit state
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$authenticated_remote" "$REVIEW_BRANCH" >/dev/null 2>&1; then
            git fetch "$authenticated_remote" "+refs/heads/$REVIEW_BRANCH:refs/remotes/origin/$REVIEW_BRANCH"
            audit_branch_tip="$(git rev-parse "origin/$REVIEW_BRANCH")"
            restore_paths=()
            # Audit state from another pipeline generation (automation/pipeline-generation)
            # is never restored: the run starts from empty checkpoints, caches, and queues.
            audit_generation="$(git show "origin/$REVIEW_BRANCH:automation/pipeline-generation" 2>/dev/null || true)"
            if [ "$audit_generation" != "$(cat automation/pipeline-generation)" ]; then
              echo "::notice::The audit branch holds another pipeline generation; starting from a fresh audit state."
              echo "AUDIT_BRANCH_TIP=$audit_branch_tip" >> "$GITHUB_ENV"
              exit 0
            fi
            if git cat-file -e "origin/$REVIEW_BRANCH:automation/collectors/checkpoints.json" 2>/dev/null; then
              restore_paths+=(automation/collectors/checkpoints.json)
            fi
            while IFS= read -r path; do
              restore_paths+=("$path")
            done < <(git ls-tree -r --name-only "origin/$REVIEW_BRANCH" -- automation/topic-routing/tag-cache)
            for directory in automation/evidence-packages automation/review-proposals; do
              while IFS= read -r path; do
                case "$path" in
                  */README.md) ;;
                  *) restore_paths+=("$path") ;;
                esac
              done < <(git ls-tree -r --name-only "origin/$REVIEW_BRANCH" -- "$directory")
            done
            if [ "${#restore_paths[@]}" -gt 0 ]; then
              git restore --source="origin/$REVIEW_BRANCH" --staged --worktree -- "${restore_paths[@]}"
            fi
          else
            audit_branch_tip=""
          fi
          echo "AUDIT_BRANCH_TIP=$audit_branch_tip" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        # Tests never reach a paid model, and their stub calls never belong
        # in the run's spend log.
        env:
          OPENAI_API_KEY: ""
          SLIBY_MODEL_CALL_LOG: ""
        run: npm test

      - name: Collect source records
        run: |
          node scripts/run-collectors.mjs \
            --checkpoints automation/collectors/checkpoints.json \
            --write-checkpoints automation/collectors/checkpoints.json \
            --output automation/runs/pipeline/github-actions/collector

      - name: Split official print texts into law changes
        timeout-minutes: 120
        run: |
          node scripts/run-print-parts.mjs \
            --collector-run automation/runs/pipeline/github-actions/collector/collector-run.json \
            --output automation/runs/pipeline/github-actions/print-parts

      - name: Screen law changes, route them to promises, check relevance, and build packages
        timeout-minutes: 120
        env:
          SLIBY_STEP: routing
        run: |
          AS_OF="${AS_OF_INPUT:-$(date -u +%F)}"
          node scripts/run-topic-routing.mjs \
            --collector-run automation/runs/pipeline/github-actions/collector/collector-run.json \
            --print-parts automation/runs/pipeline/github-actions/print-parts/print-parts.json \
            --tag-cache automation/topic-routing/tag-cache \
            --as-of "$AS_OF" \
            --output automation/runs/pipeline/github-actions/topic-routing

      - name: Queue evidence packages
        run: |
          node scripts/queue-evidence-packages.mjs \
            --input automation/runs/pipeline/github-actions/topic-routing/evidence-packages \
            --queue automation/evidence-packages

      - name: Persist model caches even on a failed run
        id: tag-cache
        # A failed run keeps the paid promise tagging, law-change screening,
        # and relevance checks it already did. A subject is cached only once
        # both of its model outputs are valid, so a partial cache is always
        # safe to keep.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          if [ -d automation/topic-routing/tag-cache ]; then
            git add automation/topic-routing/tag-cache
          fi
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Record model caches"
            git push --force-with-lease="refs/heads/$REVIEW_BRANCH:$AUDIT_BRANCH_TIP" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$REVIEW_BRANCH"
            echo "AUDIT_BRANCH_TIP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist source collection and queued evidence packages
        id: packages
        # Runs only when every earlier step succeeded, so the collection
        # record and the packages are saved together
        # from a complete run (docs/evidence-pipeline.md, Persist).
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          git add automation/collectors/checkpoints.json automation/evidence-packages
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Record source collection and queue evidence packages"
            git push --force-with-lease="refs/heads/$REVIEW_BRANCH:$AUDIT_BRANCH_TIP" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$REVIEW_BRANCH"
            echo "AUDIT_BRANCH_TIP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create audit pull request for saved collection and packages when needed
        if: steps.packages.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          cat > "$RUNNER_TEMP/evidence-package-audit-pr.md" <<'EOF'
          ## Neveřejný audit sběru a balíčků podkladů

          Tento pull request uchovává úspěšný technický sběr, uložené výsledky levných modelů a balíčky podkladů. Balíčky čekají na dva nezávislé posudky; samy nemění veřejná data, skóre ani stav zveřejnění.

          Pokud hodnocení selže nebo je přerušeno, uložené balíčky zůstanou v této auditní větvi pro další běh.
          EOF
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REVIEW_BRANCH" --title "Audit sběru dat a neveřejných návrhů SLAVA" --body-file "$RUNNER_TEMP/evidence-package-audit-pr.md"
          fi

      - name: Assess only new or changed packages
        id: assess
        timeout-minutes: 120
        env:
          SLIBY_STEP: assessment
        run: |
          node scripts/run-assessment-batch.mjs \
            --packages automation/evidence-packages \
            --proposals automation/review-proposals \
            --runs automation/runs/pipeline/github-actions/assessments \
            --summary automation/runs/pipeline/github-actions/assessment-batch.json \
            --pull-request-body automation/runs/pipeline/github-actions/assessment-review-pr.md

      # The next steps also run when the assessment stopped part-way (for
      # example on exhausted API credit), so every finished, paid assessment
      # is saved and the next run assesses only the rest.
      - name: Refresh human review pages
        if: always() && steps.assess.outcome != 'skipped'
        run: npm run reviews:refresh

      - name: Audit coverage of every published promise
        run: |
          node scripts/run-coverage-audit.mjs \
            --collector-run automation/runs/pipeline/github-actions/collector/collector-run.json \
            --topic-routing-run automation/runs/pipeline/github-actions/topic-routing/topic-routing-report.json \
            --print-parts automation/runs/pipeline/github-actions/print-parts/print-parts.json \
            --output automation/runs/pipeline/github-actions/coverage-audit.json \
            --markdown automation/runs/pipeline/github-actions/coverage-audit.md

      - name: Write audit summary
        run: |
          node --input-type=module -e '
            import { readFile, appendFile } from "node:fs/promises";
            const run = JSON.parse(await readFile("automation/runs/pipeline/github-actions/topic-routing/topic-routing-report.json", "utf8"));
            const collectorRun = JSON.parse(await readFile("automation/runs/pipeline/github-actions/collector/collector-run.json", "utf8"));
            const assessment = JSON.parse(await readFile("automation/runs/pipeline/github-actions/assessment-batch.json", "utf8"));
            const coverage = JSON.parse(await readFile("automation/runs/pipeline/github-actions/coverage-audit.json", "utf8"));
            const checkpoints = JSON.parse(await readFile("automation/collectors/checkpoints.json", "utf8"));
            const quality = coverage.quality;
            const lines = [
              "## Unpublished evidence pipeline",
              "",
              `- Published promises checked: ${run.counts.promiseCount}`,
              `- Primary records in the window: ${quality.primaryRecordsInWindow}`,
              `- Skipped, cannot be attributable conduct: ${quality.notAttributableSkipped}`,
              `- Prints with a DOCX proposal text: ${quality.printParts.printsWithProposalText} of ${quality.printParts.prints}; with an approved / passed text: ${quality.printParts.printsWithApprovedText} / ${quality.printParts.printsWithPassedText}; returned by the Senate (rejected or amended): ${quality.printParts.printsWithSenateResolution}`,
              `- Law changes: ${quality.printParts.lawChanges} (added / removed during the debate: ${quality.printParts.lawChangesAddedInDebate} / ${quality.printParts.lawChangesRemovedInDebate})`,
              `- Approved bills without an approved text on psp.cz: ${quality.printParts.approvedBillsWithoutApprovedText}; text warnings: ${quality.printParts.textWarnings}`,
              `- Law changes screened: ${quality.lawChanges} (technical ${quality.technicalLawChanges}, substantive ${quality.substantiveLawChanges})`,
              `- Routed law changes: ${quality.routedLawChanges} (direct legal-identifier link: ${quality.directLinkLawChanges})`,
              `- Routing review (needs a human routing decision): ${quality.routingReview}`,
              `- Orphan review (no safe tag or matching promise): ${quality.orphanReview}`,
              `- Routed, but the party has no conduct on the print: ${quality.routedWithoutConduct}`,
              `- Promise and law-change pairs checked / dropped as not relevant: ${quality.relevancePairs} / ${quality.relevanceDropped}`,
              `- Evidence packages: ${run.counts.packageCount} (larger than the models can read: ${quality.oversizedPackages})`,
              `- Invalid model outputs: ${quality.invalidModelOutputs}`,
              `- New assessment proposals: ${assessment.newProposalCount}`,
              `- Current proposals changing the public score: ${assessment.scoreChangeCount}; left for human review: ${assessment.humanReviewCount}`,
              `- Unchanged assessments skipped: ${assessment.unchangedCount}`,
              `- Packages larger than the models can read: ${assessment.blockedCount}`,
              `- Deferred by the per-run assessment cap (${assessment.maxAssessments}): ${assessment.deferredCount} packages, ${assessment.deferredPackageCharacters} characters`,
              `- Assessment cutoff: ${run.asOf}`,
              `- No routed law change (not a score): ${coverage.stateCounts["no-routed-law-change"]}`,
              `- Routed, but no law change kept: ${coverage.stateCounts["routed-without-kept-change"]}`,
              `- Human-review proposals or unresolved reviews: ${coverage.stateCounts["review-candidate"] + coverage.stateCounts["human-review-required"]}`,
              "- Direction assigned: no",
              "- Publication approved: no",
              "- No routed law change never becomes zero points.",
              ""
            ];
            await appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
            const sourceRows = collectorRun.collectors.map((collector) => {
              const checkpoint = checkpoints.sourceCheckpoints[collector.sourceId];
              return `| \`${collector.sourceId}\` | ${collector.collection.since} | ${collector.recordCount} | ${checkpoint?.lastObservedRecordAt?.slice(0, 10) ?? "—"} |`;
            });
            const reviewLines = [
              "",
              "## Sběr dat",
              "",
              "Tento pull request je auditní fronta. Každý běh sbírá každý zdroj celý od jeho počátečního data; sběr nemění veřejné hodnocení.",
              `Jednotkou je změna zákona, tedy jedna část úředního textu tisku (${run.routerVersion}, taxonomie ${run.taxonomyVersion}). Ke slibu vede přímá vazba přes číslo zákona nebo shoda obou nezávislých modelů na konkrétním štítku; slib a změna zůstanou spolu, pokud je obě kontroly relevance neoznačí za nesouvisející. Samotné přiřazení nepotvrzuje jednání strany ani hodnocení.`,
              "",
              "| Zdroj | Od | Záznamů | Nejnovější záznam |",
              "| --- | --- | ---: | --- |",
              ...sourceRows,
              ""
            ];
            await appendFile("automation/runs/pipeline/github-actions/assessment-review-pr.md", reviewLines.join("\n"));
          '

      - name: Commit new review proposals
        id: proposals
        if: always() && steps.assess.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          git add automation/review-proposals
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new audit data or assessment proposal was created." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Update evidence collection audit"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          git push --force-with-lease="refs/heads/$REVIEW_BRANCH:$AUDIT_BRANCH_TIP" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "AUDIT_BRANCH_TIP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The text lists what is still open against the public site, so it is
      # refreshed on every run, also when no new proposal was saved.
      - name: Create or update human-review pull request
        if: always() && steps.proposals.outcome == 'success' && hashFiles('automation/runs/pipeline/github-actions/assessment-review-pr.md') != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
          PROPOSALS_CREATED: ${{ steps.proposals.outputs.created }}
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ] && [ "$PROPOSALS_CREATED" != "true" ]; then
            echo "No review pull request is open and no new proposal was saved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "Audit sběru dat a neveřejných návrhů SLAVA" --body-file automation/runs/pipeline/github-actions/assessment-review-pr.md
            PR_URL="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          else
            if PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REVIEW_BRANCH" --title "Audit sběru dat a neveřejných návrhů SLAVA" --body-file automation/runs/pipeline/github-actions/assessment-review-pr.md 2>/tmp/slava-pr-error)"; then
              :
            else
              echo "::error::The audit branch was updated but GitHub Actions could not create the required review pull request."
              cat /tmp/slava-pr-error
              exit 1
            fi
          fi
          echo "Review pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Report model calls and estimated spend
        if: always()
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, appendFileSync } from "node:fs";
            const file = process.env.SLIBY_MODEL_CALL_LOG;
            const calls = existsSync(file) ? readFileSync(file, "utf8").split("\n").filter(Boolean).map((line) => JSON.parse(line)) : [];
            const groups = new Map();
            for (const call of calls) {
              const key = `${call.step ?? "unknown"} · ${call.model}`;
              const group = groups.get(key) ?? { calls: 0, failed: 0, input: 0, output: 0, cost: 0, unknownCost: 0 };
              group.calls += 1;
              if (!call.ok) group.failed += 1;
              group.input += call.usage?.input_tokens ?? 0;
              group.output += call.usage?.output_tokens ?? 0;
              if (call.ok && call.estimatedCostUsd === null) group.unknownCost += 1; else if (call.ok) group.cost += call.estimatedCostUsd;
              groups.set(key, group);
            }
            const total = [...groups.values()].reduce((sum, group) => sum + group.cost, 0);
            const lines = [
              "## Model calls and estimated spend",
              "",
              "Estimated from the reported tokens and automation/model-prices.json; not the provider invoice.",
              "",
              "| Step and model | Calls | Failed | Input tokens | Output tokens | Estimated USD |",
              "| --- | ---: | ---: | ---: | ---: | ---: |",
              ...[...groups].map(([key, group]) => `| ${key} | ${group.calls} | ${group.failed} | ${group.input} | ${group.output} | ${group.cost.toFixed(4)}${group.unknownCost ? ` (+${group.unknownCost} without a price)` : ""} |`),
              `| **Total** | ${calls.length} | | | | **${total.toFixed(4)}** |`,
              ""
            ];
            console.log(lines.join("\n"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          '

      - name: Upload complete unpublished pipeline audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidence-pipeline-${{ github.run_id }}
          path: automation/runs/pipeline/github-actions/
          if-no-files-found: warn
          retention-days: 30
